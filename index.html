<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Flexiones</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; color: #fff; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }

  .stage { flex: 1; position: relative; overflow: hidden; background: #000; }
  #video, #canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #canvas { pointer-events: none; }

  .count {
    position: absolute; top: 20px; left: 24px; z-index: 10;
    font-size: 5rem; font-weight: 900; color: #ff6b1a;
    font-variant-numeric: tabular-nums; line-height: 1;
    text-shadow: 0 2px 14px rgba(0,0,0,0.75);
    pointer-events: none;
  }

  .bar {
    position: absolute; right: 18px; top: 22%; bottom: 22%; width: 14px;
    background: rgba(255,255,255,0.12); border-radius: 10px; z-index: 10;
    overflow: hidden; border: 1px solid rgba(255,255,255,0.15);
  }
  .bar-fill {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 0%;
    background: linear-gradient(to top, #ff6b1a, #ffb347);
    transition: height 0.06s linear;
  }
  .bar-fill.full {
    background: linear-gradient(to top, #22c55e, #7dff9e);
    box-shadow: 0 0 20px rgba(34,197,94,0.7);
  }

  #msg {
    position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
    z-index: 10; font-size: 0.85rem; font-weight: 700;
    background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 10px;
    white-space: nowrap; pointer-events: none;
  }
  #msg.warn { color: #f59e0b; }
  #msg.ok { color: #22c55e; }

  .controls {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 10;
    display: flex; gap: 10px; padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
  }
  button {
    flex: 1; padding: 18px; border: none; border-radius: 16px;
    font-size: 1rem; font-weight: 800; cursor: pointer; font-family: inherit;
  }
  button:active { opacity: 0.7; }
  button:disabled { opacity: 0.5; }
  #startBtn { background: #ff6b1a; color: #fff; }
  #startBtn.stop { background: #ef4444; }
  #resetBtn { background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.15); }
</style>
</head>
<body>
  <div class="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="canvas"></canvas>
  </div>
  <div class="count" id="count">0</div>
  <div class="bar"><div class="bar-fill" id="barFill"></div></div>
  <p id="msg">Toca Iniciar</p>
  <div class="controls">
    <button id="startBtn">Iniciar</button>
    <button id="resetBtn">Reiniciar</button>
  </div>

<script type="module">
  import { PoseLandmarker, FilesetResolver }
    from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const ui = {
    count: document.getElementById('count'),
    msg: document.getElementById('msg'),
    barFill: document.getElementById('barFill'),
    startBtn: document.getElementById('startBtn'),
    resetBtn: document.getElementById('resetBtn'),
  };

  const CFG = {
    DOWN: 115,
    UP: 148,
    HYST: 4,
    MIN_VIS: 0.35,
    MIN_REP_MS: 280,
    SMOOTH: 0.35,
    STABLE_N: 2,
    BUFFER_N: 4
  };

  let landmarker = null, stream = null;
  let running = false, lastVideoTime = -1;
  let count = 0, phase = 'up', lastRepAt = 0, smooth = null;
  let stable = 0, buffer = [], audioCtx = null;

  function angle3(a, b, c) {
    const v1x = a.x - b.x, v1y = a.y - b.y, v1z = (a.z || 0) - (b.z || 0);
    const v2x = c.x - b.x, v2y = c.y - b.y, v2z = (c.z || 0) - (b.z || 0);
    const dot = v1x * v2x + v1y * v2y + v1z * v2z;
    const m = Math.hypot(v1x, v1y, v1z) * Math.hypot(v2x, v2y, v2z);
    return m ? Math.acos(Math.max(-1, Math.min(1, dot / m))) * 180 / Math.PI : 0;
  }

  function median(arr) {
    const s = [...arr].sort((a, b) => a - b);
    return s[Math.floor(s.length / 2)];
  }

  function beep() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = 920;
      g.gain.setValueAtTime(0.12, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
      o.connect(g).connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + 0.08);
    } catch (e) {}
  }

  const setMsg = (t, c = '') => {
    ui.msg.textContent = t;
    ui.msg.className = c;
  };

  async function loadModel() {
    const fileset = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );
    landmarker = await PoseLandmarker.createFromOptions(fileset, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
        delegate: "GPU"
      },
      runningMode: "VIDEO",
      numPoses: 1,
      minPoseDetectionConfidence: 0.5,
      minPosePresenceConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
  }

  async function openCamera() {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: 'user', width: { ideal: 720 }, height: { ideal: 1280 } }
    });
    video.srcObject = stream;
    await video.play();
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
  }

  async function start() {
    ui.startBtn.disabled = true;
    try {
      if (!landmarker) {
        ui.startBtn.textContent = "Cargando…";
        await loadModel();
      }
      ui.startBtn.textContent = "Encendiendo…";
      await openCamera();

      running = true;
      lastVideoTime = -1;
      smooth = null;
      buffer = [];
      phase = 'up';
      stable = 0;

      ui.startBtn.textContent = "Detener";
      ui.startBtn.classList.add('stop');
      ui.startBtn.disabled = false;
      setMsg("Colócate frente a la cámara", '');

      requestAnimationFrame(loop);
    } catch (err) {
      console.error(err);
      ui.startBtn.disabled = false;
      ui.startBtn.textContent = "Iniciar";
      setMsg(err.message, 'warn');
    }
  }

  function stop() {
    running = false;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    video.srcObject = null;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ui.startBtn.textContent = "Iniciar";
    ui.startBtn.classList.remove('stop');
    setMsg("Listo", '');
    ui.barFill.style.height = '0%';
    ui.barFill.classList.remove('full');
  }

  function loop() {
    if (!running) return;
    if (video.readyState >= 2 && video.videoWidth && video.currentTime !== lastVideoTime) {
      lastVideoTime = video.currentTime;
      try {
        const res = landmarker.detectForVideo(video, performance.now());
        handle(res);
      } catch (e) {}
    }
    requestAnimationFrame(loop);
  }

  function drawSkeleton(lms) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const W = canvas.width, H = canvas.height;
    const vis = i => lms[i]?.visibility ?? 0;

    ctx.strokeStyle = '#ff6b1a';
    ctx.lineWidth = Math.max(6, W / 90);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const line = (i, j) => {
      if (vis(i) < 0.3 || vis(j) < 0.3) return;
      ctx.beginPath();
      ctx.moveTo(lms[i].x * W, lms[i].y * H);
      ctx.lineTo(lms[j].x * W, lms[j].y * H);
      ctx.stroke();
    };

    line(11, 12);
    line(11, 13); line(13, 15);
    line(12, 14); line(14, 16);

    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#ff6b1a';
    ctx.lineWidth = Math.max(2, W / 300);
    [11, 12, 13, 14, 15, 16].forEach(i => {
      if (vis(i) < 0.3) return;
      ctx.beginPath();
      ctx.arc(lms[i].x * W, lms[i].y * H, Math.max(6, W / 100), 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    });
  }

  function handle(res) {
    const lms = res.landmarks?.[0];
    const wl = res.worldLandmarks?.[0];

    if (!lms) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      setMsg("No te veo 👀", 'warn');
      return;
    }

    drawSkeleton(lms);

    const vis = i => lms[i]?.visibility ?? 0;
    const lArmVis = Math.min(vis(11), vis(13), vis(15));
    const rArmVis = Math.min(vis(12), vis(14), vis(16));

    if (Math.max(lArmVis, rArmVis) < CFG.MIN_VIS) {
      setMsg("Brazos visibles 📐", 'warn');
      return;
    }

    const P = (wl && wl.length === lms.length) ? wl : lms;
    const lElbow = angle3(P[11], P[13], P[15]);
    const rElbow = angle3(P[12], P[14], P[16]);

    let rawElbow;
    if (lArmVis > 0.5 && rArmVis > 0.5) {
      rawElbow = (lElbow + rElbow) / 2;
    } else if (lArmVis > rArmVis) {
      rawElbow = lElbow;
    } else {
      rawElbow = rElbow;
    }

    buffer.push(rawElbow);
    if (buffer.length > CFG.BUFFER_N) buffer.shift();
    const med = median(buffer);

    smooth = smooth === null ? med : smooth * CFG.SMOOTH + med * (1 - CFG.SMOOTH);
    const elbow = smooth;

    const pct = Math.max(0, Math.min(1, (elbow - CFG.DOWN) / (CFG.UP - CFG.DOWN)));
    ui.barFill.style.height = (pct * 100).toFixed(1) + '%';

    if (pct >= 0.97) ui.barFill.classList.add('full');
    else ui.barFill.classList.remove('full');

    const now = performance.now();
    if (phase === 'up') {
      if (elbow < CFG.DOWN - CFG.HYST) {
        if (++stable >= CFG.STABLE_N && now - lastRepAt > CFG.MIN_REP_MS) {
          phase = 'down';
          stable = 0;
        }
      } else {
        stable = 0;
      }
    } else {
      if (elbow > CFG.UP + CFG.HYST) {
        if (++stable >= CFG.STABLE_N) {
          phase = 'up';
          stable = 0;
          lastRepAt = now;
          count++;
          ui.count.textContent = count;
          beep();
        }
      } else {
        stable = 0;
      }
    }

    setMsg(phase === 'down' ? "Sube ⬆️" : "Baja ⬇️", 'ok');
  }

  ui.startBtn.addEventListener('click', () => running ? stop() : start());

  ui.resetBtn.addEventListener('click', () => {
    count = 0;
    phase = 'up';
    lastRepAt = 0;
    smooth = null;
    stable = 0;
    buffer = [];
    ui.count.textContent = "0";
    ui.barFill.style.height = '0%';
    ui.barFill.classList.remove('full');
  });
</script>
</body>
</html>
