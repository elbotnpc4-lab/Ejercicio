<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contador de flexiones 💪</title>
<style>
  :root{
    --panel:#141a22; --line:#233040; --txt:#e6edf3; --dim:#8b98a9;
    --accent:#22d3ee; --ok:#22c55e; --warn:#f59e0b;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; padding:22px 16px 40px;
    background:radial-gradient(900px 500px at 50% -10%, #16212e, #0b0f14 65%);
    color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center; gap:16px;
  }
  h1{font-size:1.4rem; margin:0; font-weight:800; letter-spacing:.2px}
  .sub{color:var(--dim); font-size:.86rem; text-align:center; max-width:620px; margin:0; line-height:1.5}
  .stage{
    position:relative; width:min(94vw,760px); aspect-ratio:4/3;
    background:#05070a; border:1px solid var(--line); border-radius:18px;
    overflow:hidden; transform:scaleX(-1);            /* efecto espejo */
    box-shadow:0 24px 60px rgba(0,0,0,.55);
  }
  #video, #canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
  #canvas{pointer-events:none}
  .stats{width:min(94vw,760px); display:grid; grid-template-columns:1.2fr 1fr 1fr; gap:12px}
  .card{
    background:linear-gradient(180deg,#161d27,#121820);
    border:1px solid var(--line); border-radius:14px; padding:12px 14px;
    display:flex; flex-direction:column; gap:4px; min-height:84px; justify-content:center;
  }
  .card .label{font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--dim)}
  .card .value{font-size:2rem; font-weight:800; line-height:1.05; font-variant-numeric:tabular-nums}
  .card.count .value{color:var(--accent)}
  .card .value.small{font-size:1.15rem}
  .msgs{width:min(94vw,760px); display:flex; flex-direction:column; gap:6px; min-height:26px}
  .msg{font-size:.9rem; display:flex; align-items:center; gap:8px; margin:0}
  .msg.ok{color:var(--ok)} .msg.warn{color:var(--warn)} .msg.dim{color:var(--dim)}
  .controls{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
  button{
    font:inherit; font-weight:700; cursor:pointer; border-radius:12px;
    padding:12px 22px; border:1px solid transparent; transition:.15s;
  }
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.6; cursor:progress}
  #startBtn{background:var(--accent); color:#04222a; box-shadow:0 8px 24px rgba(34,211,238,.25)}
  #startBtn.stop{background:#ef4444; color:#fff; box-shadow:none}
  #resetBtn{background:transparent; color:var(--txt); border-color:var(--line)}
  .pop{animation:pop .28s ease}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}
  @media (max-width:520px){
    .stats{grid-template-columns:1fr 1fr}
    .card.count{grid-column:1/-1}
  }
</style>
</head>
<body>

  <h1>💪 Contador de flexiones</h1>
  <p class="sub">
    Coloca el móvil/portátil <strong>de lado</strong> a ti (en el suelo o sobre una silla),
    de forma que se vean <strong>hombro, codo, muñeca y cadera</strong>. Pulsa iniciar y ¡a darle!
  </p>

  <div class="stage">
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <div class="stats">
    <div class="card count">
      <span class="label">Flexiones</span>
      <span class="value" id="count">0</span>
    </div>
    <div class="card">
      <span class="label">Fase</span>
      <span class="value small" id="stateTxt">—</span>
    </div>
    <div class="card">
      <span class="label">Ángulo codo</span>
      <span class="value small" id="angleTxt">—</span>
    </div>
  </div>

  <div class="msgs">
    <p class="msg dim" id="posture">Esperando cámara…</p>
    <p class="msg dim" id="hint">Pulsa «Iniciar cámara»</p>
  </div>

  <div class="controls">
    <button id="startBtn">Iniciar cámara</button>
    <button id="resetBtn">Reiniciar contador</button>
  </div>

<script type="module">
import { PoseLandmarker, FilesetResolver, DrawingUtils }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

/* ---------------- Elementos ---------------- */
const video  = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
const stage  = document.querySelector('.stage');

const ui = {
  count:    document.getElementById('count'),
  stateTxt: document.getElementById('stateTxt'),
  angleTxt: document.getElementById('angleTxt'),
  posture:  document.getElementById('posture'),
  hint:     document.getElementById('hint'),
  startBtn: document.getElementById('startBtn'),
  resetBtn: document.getElementById('resetBtn'),
};

/* ---------------- Ajustes ---------------- */
const DOWN_ANGLE = 100;   // codo doblado  -> fase "abajo"
const UP_ANGLE   = 150;   // brazos rectos -> fase "arriba"
const MIN_VIS    = 0.5;   // visibilidad mínima de las articulaciones
const MIN_REP_MS = 350;   // tiempo mínimo entre repeticiones

/* ---------------- Estado ---------------- */
let poseLandmarker = null;
let drawing = null;
let stream = null;
let running = false;
let lastVideoTime = -1;

let count = 0;
let phase = 'up';
let lastRepAt = 0;
let audioCtx = null;

/* ---------------- Utilidades ---------------- */
function angle3(a, b, c){
  const v1 = { x:a.x-b.x, y:a.y-b.y, z:(a.z||0)-(b.z||0) };
  const v2 = { x:c.x-b.x, y:c.y-b.y, z:(c.z||0)-(b.z||0) };
  const dot = v1.x*v2.x + v1.y*v2.y + v1.z*v2.z;
  const m = Math.hypot(v1.x,v1.y,v1.z) * Math.hypot(v2.x,v2.y,v2.z);
  if (!m) return 0;
  return Math.acos(Math.max(-1, Math.min(1, dot/m))) * 180 / Math.PI;
}

function beep(freq = 880, dur = 0.09, vol = 0.12){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + dur);
  }catch(e){ /* silencio */ }
}

const setHint    = (t, c='dim') => { ui.hint.textContent = t;    ui.hint.className = 'msg ' + c; };
const setPosture = (t, c='dim') => { ui.posture.textContent = t; ui.posture.className = 'msg ' + c; };

/* ---------------- Cargar modelo ---------------- */
async function loadModel(){
  const fileset = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  poseLandmarker = await PoseLandmarker.createFromOptions(fileset, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numPoses: 1
  });
  drawing = new DrawingUtils(ctx);
}

/* ---------------- Cámara ---------------- */
async function start(){
  ui.startBtn.disabled = true;

  try{
    if (!poseLandmarker){
      ui.startBtn.textContent = "Cargando modelo…";
      await loadModel();
    }

    ui.startBtn.textContent = "Encendiendo cámara…";
    stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" },
      audio: false
    });

    video.srcObject = stream;
    await video.play();

    canvas.width  = video.videoWidth;
    canvas.height = video.videoHeight;
    stage.style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`;

    running = true;
    lastVideoTime = -1;
    ui.startBtn.textContent = "Detener";
    ui.startBtn.classList.add('stop');
    ui.startBtn.disabled = false;
    setHint("Buscando tu cuerpo…", "dim");

    requestAnimationFrame(loop);
  }catch(err){
    console.error(err);
    ui.startBtn.disabled = false;
    ui.startBtn.textContent = "Reintentar";
    setHint("Error: " + err.message, "warn");
  }
}

function stop(){
  running = false;
  if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ui.startBtn.textContent = "Iniciar cámara";
  ui.startBtn.classList.remove('stop');
  setHint("Cámara detenida", "dim");
  setPosture("—", "dim");
  ui.stateTxt.textContent = "—";
  ui.angleTxt.textContent = "—";
}

/* ---------------- Bucle principal ---------------- */
function loop(){
  if (!running) return;

  if (video.readyState >= 2 && video.videoWidth){
    if (video.currentTime !== lastVideoTime){
      lastVideoTime = video.currentTime;
      let res = null;
      try{
        res = poseLandmarker.detectForVideo(video, performance.now());
      }catch(e){ console.error(e); }
      if (res) handleResults(res);
    }
  }
  requestAnimationFrame(loop);
}

/* ---------------- Análisis ---------------- */
function handleResults(res){
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const lms = res.landmarks?.[0];
  const wl  = res.worldLandmarks?.[0];

  if (!lms){
    setHint("No te veo 👀 — colócate dentro del encuadre", "warn");
    return;
  }

  // Dibujar esqueleto
  if (drawing){
    drawing.drawConnectors(lms, PoseLandmarker.POSE_CONNECTIONS,
      { color: "#22d3ee", lineWidth: 4 });
    drawing.drawLandmarks(lms,
      { color: "#e6edf3", fillColor: "#22d3ee", radius: 4, lineWidth: 0 });
  }

  // Elegimos el lado (izq/der) que mejor se ve
  const vis = i => lms[i]?.visibility ?? 0;
  const leftScore  = (vis(11) + vis(13) + vis(15)) / 3;
  const rightScore = (vis(12) + vis(14) + vis(16)) / 3;
  const side = leftScore >= rightScore
    ? { s:11, e:13, w:15, h:23, k:27 }
    : { s:12, e:14, w:16, h:24, k:28 };

  const minVis = Math.min(vis(side.s), vis(side.e), vis(side.w), vis(side.h));
  if (minVis < MIN_VIS){
    setHint("Colócate de lado a la cámara y que se vea todo el cuerpo", "warn");
    return;
  }

  const P = (wl && wl.length) ? wl : lms;   // preferimos coordenadas 3D reales
  const elbow = angle3(P[side.s], P[side.e], P[side.w]);  // hombro-codo-muñeca
  const body  = angle3(P[side.s], P[side.h], P[side.k]);  // hombro-cadera-tobillo

  ui.angleTxt.textContent = Math.round(elbow) + "°";

  /* --- Postura --- */
  if (body > 150){
    setPosture("✅ Cuerpo alineado", "ok");
  } else {
    setPosture("⚠️ Mantén la espalda recta (cadera alineada)", "warn");
  }

  /* --- Máquina de estados del contador --- */
  const now = performance.now();

  if (phase === 'up' && elbow < DOWN_ANGLE && (now - lastRepAt) > MIN_REP_MS){
    phase = 'down';
  }

  if (phase === 'down' && elbow > UP_ANGLE){
    phase = 'up';
    lastRepAt = now;
    count++;
    ui.count.textContent = count;
    ui.count.classList.add('pop');
    setTimeout(() => ui.count.classList.remove('pop'), 280);
    beep(920, 0.09);
  }

  ui.stateTxt.textContent = phase === 'down' ? "Abajo ⬇️" : "Arriba ⬆️";
  setHint("¡Bien! Sigue así 🔥", "ok");
}

/* ---------------- Botones ---------------- */
ui.startBtn.addEventListener('click', () => {
  if (running) stop();
  else start();
});

ui.resetBtn.addEventListener('click', () => {
  count = 0;
  phase = 'up';
  lastRepAt = 0;
  ui.count.textContent = "0";
});
</script>
</body>
</html>
